# Kima - Premium Self-Hosted Music Server
# All-in-One container with AI-powered vibe matching
#
# Features included:
#   - Smart playlists with mood detection
#   - Enhanced vibe matching (Essentia AI)
#   - High-quality audio streaming
#
# Usage:
#   1. Set MUSIC_PATH to the absolute path of an existing music directory.
#      On a NAS/DAS check that the intended external filesystem is mounted.
#   2. Optionally set VERSION (default: versioned v1.22.0 release).
#   3. Run: docker compose -f docker-compose.prod.yml up -d
#   3. Open http://localhost:3030

services:
  kima:
    # Fixed, published stable. Never automatically follow :latest.
    # Pin VERSION to the existing deployment's tag for any controlled upgrade.
    image: ghcr.io/oxygengs/kima-hub:${VERSION:-v1.22.0}
    container_name: kima
    ports:
      - "${PORT:-3030}:3030"
    volumes:
      # REQUIRED: host's real music directory, not an automatically created
      # empty fallback. Fail Compose interpolation when MUSIC_PATH is unset.
      - type: bind
        source: ${MUSIC_PATH:?Set MUSIC_PATH to the absolute path of your existing music directory}
        target: /music
        bind:
          create_host_path: false
      # Persistent data (database, cache, etc.)
      - kima_data:/data
    environment:
      - TZ=${TZ:-UTC}
      - SESSION_SECRET=${SESSION_SECRET:-}
      # Lidarr webhook callback URL - how Lidarr reaches Kima when downloads complete
      # Default uses host.docker.internal which works on most setups with extra_hosts below
      # Override if using custom Docker networks: e.g., http://YOUR_KIMA_SERVER_IP:3030
      - KIMA_CALLBACK_URL=${KIMA_CALLBACK_URL:-http://host.docker.internal:3030}
      - DISABLE_CLAP=${DISABLE_CLAP:-}
    # Makes host.docker.internal work on Linux (already works on Docker Desktop)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Cap memory to prevent host kernel OOM cascade from anon_vma_chain slab exhaustion.
    # Without this, the host kernel OOM killer fires when Next.js VMA chains accumulate.
    # 6g is enough for frontend + backend + embeddings + Redis + Postgres.
    mem_limit: 6g
    memswap_limit: 8g
    # vm.overcommit_memory is a HOST sysctl, not supported by Docker's
    # container sysctls. Configure it on the host only if an admin approves.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "/app/healthcheck.js"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

volumes:
  kima_data:
