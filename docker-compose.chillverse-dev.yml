# Isolated, lightweight Chillverse Listen test stack for CT 105.
# Run with: docker compose --env-file .env.chillverse-dev -f docker-compose.chillverse-dev.yml ...
# Never bind production music/download folders or point DATABASE_URL at production.
name: chillverse-listen-dev

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: kima_dev
      POSTGRES_USER: kima_dev
      POSTGRES_PASSWORD: ${DEV_DB_PASSWORD:?Set DEV_DB_PASSWORD in .env.chillverse-dev}
    volumes:
      - dev_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kima_dev -d kima_dev"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    mem_limit: 512m
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 128m
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://kima_dev:${DEV_DB_PASSWORD}@postgres:5432/kima_dev
      REDIS_URL: redis://redis:6379
      PORT: "3006"
      NODE_ENV: production
      SESSION_SECRET: ${DEV_SESSION_SECRET:?Set DEV_SESSION_SECRET in .env.chillverse-dev}
      SETTINGS_ENCRYPTION_KEY: ${DEV_ENCRYPTION_KEY:?Set DEV_ENCRYPTION_KEY in .env.chillverse-dev}
      INTERNAL_API_SECRET: ${DEV_INTERNAL_API_SECRET:?Set DEV_INTERNAL_API_SECRET in .env.chillverse-dev}
      MUSIC_PATH: /music
      ALLOWED_ORIGINS: http://10.0.0.23:3030
      LOG_LEVEL: info
    volumes:
      - dev_music:/music
      - dev_cache:/app/cache
      - dev_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 1536m
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
        NEXT_PUBLIC_BACKEND_URL: http://backend:3006
        NEXT_PUBLIC_BUILD_TYPE: dev
    environment:
      NODE_ENV: production
      BACKEND_URL: http://backend:3006
      NEXT_PUBLIC_API_URL: ""
    ports:
      - "10.0.0.23:3030:3030"
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 1024m
    restart: unless-stopped

volumes:
  dev_postgres:
  dev_music:
  dev_cache:
  dev_logs:
