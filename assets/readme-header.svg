    <linearGradient id="edge"><stop stop-color="#ffb000" stop-opacity=".6"/><stop offset="1" stop-color="#ffb000" stop-opacity="0"/></linearGradient>
  </defs>
  <rect x="1" y="1" width="1278" height="374" rx="28" fill="url(#background)" stroke="#303034"/>
  <ellipse cx="1030" cy="172" rx="420" ry="310" fill="url(#glow)"/>
