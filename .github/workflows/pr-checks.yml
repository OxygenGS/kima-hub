name: PR Checks

# New commits supersede older drafts; avoid building every intermediate state.
concurrency:
    group: pr-checks-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

on:
    pull_request:
        branches: [main]
        types: [opened, synchronize, reopened]

jobs:
    change-scope:
      name: Classify frontend-only UI change
      runs-on: ubuntu-24.04
      permissions:
        contents: read
        pull-requests: read
      outputs:
        fast_ui: ${{ steps.scope.outputs.fast_ui }}
      steps:
        - id: scope
          uses: actions/github-script@v7
          with:
            script: |
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                per_page: 100,
              });
              const allowed = /^(frontend\/(app|features)\/.+\.(tsx|ts)|frontend\/lib\/i18n\/.+\.ts|frontend\/lib\/__tests__\/.+\.(tsx|ts)|docs\/internationalization\.md)$/;
              const fast = files.length > 0 && files.every(file =>
                ['modified', 'added'].includes(file.status) && allowed.test(file.filename)
              );
              core.setOutput('fast_ui', String(fast));
              core.info(fast ? 'Frontend-only UI: skip costly image jobs.' : 'Run full image validation.');
    naming-audit:
        name: No Legacy Project Naming
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4
            - name: Check tracked files and filenames
              shell: bash
              run: |
                  set -euo pipefail
                  if git grep -nI -i -E 'chill[-_[:space:]]*verse' -- .; then
                      echo "Legacy project name found in tracked content."
                      exit 1
                  fi
                  if git ls-files | grep -E -i 'chill[-_[:space:]]*verse'; then
                      echo "Legacy project name found in tracked filenames."
                      exit 1
                  fi
                  echo "No legacy project naming remains in the checkout."

    lint-frontend:
        name: Frontend Lint & Unit Tests
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: "npm"
                  cache-dependency-path: frontend/package-lock.json

            - name: Install dependencies
              working-directory: frontend
              run: npm ci

            # Run the unit suite before lint so pre-existing lint errors do not
            # prevent tests from executing. ESLint still fails this job.
            - name: Run frontend unit tests
              working-directory: frontend
              run: npm run test:unit

            - name: Run ESLint
              working-directory: frontend
              run: npm run lint

    typecheck:
        name: TypeScript Typecheck
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: "npm"
                  cache-dependency-path: frontend/package-lock.json

            - name: Typecheck frontend
              working-directory: frontend
              run: |
                  npm ci
                  npm run typecheck

            - uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: "npm"
                  cache-dependency-path: backend/package-lock.json

            - name: Typecheck backend
              working-directory: backend
              run: |
                  npm ci
                  npm run typecheck

    unit-tests:
        name: Backend Unit Tests
        runs-on: ubuntu-24.04
        # The social integration suite (vibeProfile/social/socialProfile) needs a
        # real Postgres with pgvector -- not stock postgres, `vibe.fused_track`'s
        # v3 column is a vector type. DATABASE_URL below is the same
        # test/test@localhost:5433/test that backend/src/__mocks__/test-env.cjs
        # falls back to for local dev (see test-db-defaults.cjs), so this job
        # doesn't need its own separate credentials to keep in sync.
        services:
            postgres:
                image: pgvector/pgvector:pg16
                env:
                    POSTGRES_USER: test
                    POSTGRES_PASSWORD: test
                    POSTGRES_DB: test
                ports:
                    - 5433:5432
                options: >-
                    --health-cmd "pg_isready -U test -d test"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
            redis:
                image: redis:7-alpine
                ports:
                    - 6390:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        env:
            DATABASE_URL: postgresql://test:test@localhost:5433/test
            REDIS_URL: redis://127.0.0.1:6390
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: "npm"
                  cache-dependency-path: backend/package-lock.json

            - name: Install dependencies
              working-directory: backend
              run: npm ci

            - name: Apply database migrations
              working-directory: backend
              run: npx prisma migrate deploy

            - name: Run Jest
              working-directory: backend
              # Exclude webhookEventStore -- it is an integration test requiring
              # a live PostgreSQL database. It runs in integration.yml instead.
              # (Unrelated to the Postgres service above, which now covers the
              # vibeProfile/social/socialProfile integration suite instead --
              # see backend/src/__mocks__/test-global-setup.cjs for the one
              # thing a fresh database here still doesn't have: the vibe-engine's
              # OWN tables, not owned by these migrations. It bootstraps a
              # minimal stand-in; see that file's comment for the real boundary.)
              # Explicitly limit parallel Jest workers so DB/Redis integration
              # fixtures do not contend with the other PR checks on one runner.
              # Keep the same functional suite and per-worker test isolation.
              run: npm test -- --maxWorkers=4 --passWithNoTests --testPathIgnorePatterns="webhookEventStore"

    build-docker:
        name: Docker Build Check
        runs-on: ubuntu-24.04
        needs: [change-scope, lint-frontend, typecheck, unit-tests]
        if: needs.change-scope.outputs.fast_ui != 'true'
        steps:
            - uses: actions/checkout@v4

            - name: Validate fork Compose installation and update examples
              run: bash .github/ci/check-fork-compose.sh

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build Docker image (no push)
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: false
                  tags: kima:pr-check
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    aio-smoke:
        name: All-in-One Fresh-Install Smoke Test
        runs-on: ubuntu-24.04
        timeout-minutes: 90
        needs: [build-docker]
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4

            # The full AIO image includes PyTorch/Essentia and model files.
            # Free up preinstalled SDKs before loading the image into Docker.
            - name: Free disk and record runner resources
              run: |
                  sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android "$AGENT_TOOLSDIRECTORY"
                  df -h /
                  free -h

            - uses: docker/setup-buildx-action@v3

            - name: Build and load local AIO image (never push)
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: false
                  load: true
                  tags: kima-hub:aio-ci-smoke
                  cache-from: type=gha
                  build-args: |
                      NEXT_PUBLIC_BUILD_TYPE=ci-smoke

            # Node is needed by the real-account Playwright smoke on this runner.
            - uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json

            - name: Boot a fresh isolated AIO instance and check endpoints
              shell: bash
              timeout-minutes: 35
              run: |
                  set -euo pipefail

                  name="kima-aio-ci-smoke"
                  docker volume create kima-ci-aio-data
                  docker volume create kima-ci-aio-music

                  cleanup() {
                      docker logs --tail 100 "$name" || true
                      docker rm -f "$name" || true
                      docker volume rm -f kima-ci-aio-data kima-ci-aio-music || true
                  }
                  trap cleanup EXIT

                  # Only loopback is published on GitHub's disposable runner.
                  # No secrets, no production mounts, no registry push.
                  docker run -d --name "$name" \
                      --memory=6g \
                      -p 127.0.0.1:3130:3030 \
                      -v kima-ci-aio-data:/data \
                      -v kima-ci-aio-music:/music \
                      -e DISABLE_CLAP=true \
                      kima-hub:aio-ci-smoke

                  ready=false
                  for i in $(seq 1 120); do
                      health="$(docker inspect --format '{{.State.Health.Status}}' "$name")"
                      state="$(docker inspect --format '{{.State.Status}}' "$name")"
                      if [ "$health" = "healthy" ]; then
                          ready=true
                          break
                      fi
                      if [ "$state" = "exited" ] || [ "$state" = "dead" ]; then
                          echo "Container stopped unexpectedly: $state"
                          break
                      fi
                      sleep 5
                  done

                  if [ "$ready" != true ]; then
                      echo "AIO did not become healthy within 10 minutes."
                      exit 1
                  fi

                  curl -fsS --max-time 20 http://127.0.0.1:3130/onboarding -o /dev/null

                  curl -fsS --max-time 20 http://127.0.0.1:3130/api/branding \
                      | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["name"] == "Kima", d; assert d["accentColor"] == "#fca200", d; print("Fresh-install default branding OK")'

                  # Fresh installs must have both permission fields and the
                  # instance branding table after automatic Prisma migrations.
                  n="$(docker exec -u postgres "$name" psql -d kima -Atc "SELECT count(*) FROM information_schema.columns WHERE table_name='User' AND column_name IN ('canRequestAlbums','canDownloadTracks')")"
                  test "$n" = "2"
                  table="$(docker exec -u postgres "$name" psql -d kima -Atc "SELECT count(*) FROM information_schema.tables WHERE table_name='BrandingSettings'")"
                  test "$table" = "1"
                  echo "Fresh-install Prisma migrations OK"
                  # AIO PostgreSQL is an internal service, never a network-facing one.
                  listen="$(docker exec -u postgres "$name" psql -d kima -Atc "SHOW listen_addresses")"
                  if [ "$listen" != "localhost" ]; then
                      echo "Unsafe fresh-install PostgreSQL listen_addresses: $listen"
                      exit 1
                  fi
                  echo "Fresh-install PostgreSQL loopback binding OK"


                  # An unauthenticated visitor cannot edit installation branding.
                  status="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' \
                      -X POST -H 'Content-Type: application/json' \
                      -d '{"name":"Unauthorized"}' \
                      http://127.0.0.1:3130/api/branding)"
                  if [ "$status" != "401" ] && [ "$status" != "403" ]; then
                      echo "Unexpected unauthenticated branding update status: $status"
                      exit 1
                  fi

                  echo "AIO fresh-install smoke test passed"

                  # Runs against this SAME isolated AIO container and /music
                  # volume. Synthetic 440Hz WAV only; no real user media.
                  bash .github/ci/aio-audio-smoke.sh "$name" "http://127.0.0.1:3130"

                  # Real login and Settings/Search locale checks on the same
                  # throwaway AIO, as both the synthetic admin and listener.
                  bash .github/ci/aio-auth-locale-smoke.sh "http://127.0.0.1:3130"

            # Reuse the just-loaded AIO image to test the real start.sh
            # against an OLD PostgreSQL data directory. No second big image
            # build or pushed registry image is necessary.
            - name: Checkout pinned pre-fork Kima database schema
              uses: actions/checkout@v4
              with:
                  ref: 1b390bc60cf915b6314da382cbd7a1ee3ce2f6ee
                  path: baseline

            - uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: npm
                  cache-dependency-path: backend/package-lock.json

            - name: Install migration tooling for legacy volume
              working-directory: backend
              run: npm ci

            - name: Upgrade existing AIO /data and verify a second startup
              shell: bash
              timeout-minutes: 25
              run: bash .github/ci/aio-volume-upgrade.sh

            # Pull the real published upstream v1.10.0 AIO image, create
            # synthetic accounts/media, upgrade a copied /data with this
            # candidate, and independently restore upstream using old data.
            # No registry push, no production endpoints or mounts.
            - name: Real upstream AIO image upgrade and rollback rehearsal
              shell: bash
              timeout-minutes: 35
              run: bash .github/ci/aio-real-image-rehearsal.sh

    db-upgrade:
        name: Existing Kima Database Upgrade & Restore
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        permissions:
            contents: read
        services:
            postgres:
                image: pgvector/pgvector:pg16
                env:
                    POSTGRES_USER: test
                    POSTGRES_PASSWORD: test
                    POSTGRES_DB: upgrade_source
                ports:
                    - 5434:5432
                options: >-
                    --health-cmd "pg_isready -U test -d upgrade_source"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 10
        env:
            # Synthetic test-only credentials on a throwaway GitHub runner.
            PGPASSWORD: test
            PGHOST: localhost
            PGPORT: "5434"
            PGUSER: test
        steps:
            - name: Checkout Kima Hub candidate
              uses: actions/checkout@v4

            - name: Checkout pristine upstream baseline (pinned main)
              uses: actions/checkout@v4
              with:
                  # Pre-fork Kima v1.10.0 schema, without music permissions
                  # or BrandingSettings. Pinned for reproducible upgrades.
                  ref: 1b390bc60cf915b6314da382cbd7a1ee3ce2f6ee
                  path: baseline

            - uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: npm
                  cache-dependency-path: backend/package-lock.json

            - name: Install Prisma CLI and PostgreSQL client
              run: |
                  cd backend
                  npm ci
                  if ! command -v psql >/dev/null || ! command -v pg_dump >/dev/null; then
                      sudo apt-get update -qq
                      sudo apt-get install -y postgresql-client
                  fi
                  psql --version
                  pg_dump --version

            - name: Build a pre-fork database using baseline migration history
              working-directory: backend
              env:
                  DATABASE_URL: postgresql://test:test@localhost:5434/upgrade_source
              run: npx prisma migrate deploy --schema ../baseline/backend/prisma/schema.prisma

            - name: Confirm old schema, then insert synthetic accounts and library
              shell: bash
              run: |
                  set -euo pipefail
                  count="$(psql -d upgrade_source -Atc "SELECT COUNT(*) FROM information_schema.columns WHERE table_name='User' AND column_name IN ('canRequestAlbums','canDownloadTracks')")"
                  test "$count" = "0"
                  absent="$(psql -d upgrade_source -Atc "SELECT to_regclass('public.\"BrandingSettings\"') IS NULL")"
                  test "$absent" = "t"
                  psql -v ON_ERROR_STOP=1 -d upgrade_source -f .github/ci/upgrade-fixture.sql

            - name: Back up the old database, create a separate restored copy
              shell: bash
              run: |
                  set -euo pipefail
                  pg_dump --format=custom --no-owner --no-acl \
                      --file="$RUNNER_TEMP/legacy-kima.dump" -d upgrade_source
                  test -s "$RUNNER_TEMP/legacy-kima.dump"
                  psql -v ON_ERROR_STOP=1 -d postgres -c "CREATE DATABASE upgrade_restored;"
                  pg_restore --exit-on-error --no-owner --no-acl \
                      -d upgrade_restored "$RUNNER_TEMP/legacy-kima.dump"
                  echo "A complete synthetic pre-upgrade backup was restored."

            - name: Upgrade only the restored copy using fork migrations
              working-directory: backend
              env:
                  DATABASE_URL: postgresql://test:test@localhost:5434/upgrade_restored
              run: npx prisma migrate deploy

            - name: Verify preserved data, relationships, settings and permission defaults
              run: |
                  psql -v ON_ERROR_STOP=1 -d upgrade_restored \
                      -f .github/ci/assert-upgrade.sql

            - name: Simulate post-upgrade admin changes
              run: |
                  psql -v ON_ERROR_STOP=1 -d upgrade_restored <<'SQL'
                  UPDATE "User"
                  SET "canRequestAlbums"=true, "canDownloadTracks"=true
                  WHERE "id"='upgrade-listener';

                  INSERT INTO "BrandingSettings"
                      ("id","name","tagline","accentColor","backgroundColor","updatedAt")
                  VALUES
                      ('default','Kima Hub Upgrade Fixture','Kept across migrations',
                       '#3dacdb','#0a0a0a',NOW());
                  SQL

            - name: Run migrations a second time (idempotence)
              working-directory: backend
              env:
                  DATABASE_URL: postgresql://test:test@localhost:5434/upgrade_restored
              run: npx prisma migrate deploy

            - name: Check custom brand and granted rights survive re-deploy
              run: |
                  psql -v ON_ERROR_STOP=1 -d upgrade_restored \
                      -f .github/ci/assert-upgrade-second-pass.sql

            - name: Verify backup can independently restore the original version
              shell: bash
              run: |
                  set -euo pipefail
                  psql -v ON_ERROR_STOP=1 -d postgres -c "CREATE DATABASE upgrade_rollback;"
                  pg_restore --exit-on-error --no-owner --no-acl \
                      -d upgrade_rollback "$RUNNER_TEMP/legacy-kima.dump"

                  old_user="$(psql -d upgrade_rollback -Atc "SELECT count(*) FROM \"User\" WHERE id IN ('upgrade-admin','upgrade-listener')")"
                  test "$old_user" = "2"
                  old_track="$(psql -d upgrade_rollback -Atc "SELECT count(*) FROM \"Track\" WHERE id='upgrade-track'")"
                  test "$old_track" = "1"
                  old_permissions="$(psql -d upgrade_rollback -Atc "SELECT count(*) FROM information_schema.columns WHERE table_name='User' AND column_name IN ('canRequestAlbums','canDownloadTracks')")"
                  test "$old_permissions" = "0"
                  echo "Legacy data restored again from backup, with original schema."

                  source_permissions="$(psql -d upgrade_source -Atc "SELECT count(*) FROM information_schema.columns WHERE table_name='User' AND column_name IN ('canRequestAlbums','canDownloadTracks')")"
                  test "$source_permissions" = "0"
                  echo "Original source database remained untouched."

