name: PR Checks

# New commits supersede older drafts; avoid building every intermediate state.
concurrency:
    group: pr-checks-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

on:
    pull_request:
        branches: [main]
        types: [opened, synchronize, reopened]

jobs:
    lint-frontend:
        name: Frontend Lint & Unit Tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: "npm"
                  cache-dependency-path: frontend/package-lock.json

            - name: Install dependencies
              working-directory: frontend
              run: npm ci

            - name: Run ESLint
              working-directory: frontend
              run: npm run lint

            # These 303 tests existed for months without ever running in CI --
            # nothing in any workflow referenced vitest. They take under a
            # second and this job has already paid for `npm ci`.
            - name: Run frontend unit tests
              working-directory: frontend
              run: npm run test:unit

    typecheck:
        name: TypeScript Typecheck
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: "npm"
                  cache-dependency-path: frontend/package-lock.json

            - name: Typecheck frontend
              working-directory: frontend
              run: |
                  npm ci
                  npm run typecheck

            - uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: "npm"
                  cache-dependency-path: backend/package-lock.json

            - name: Typecheck backend
              working-directory: backend
              run: |
                  npm ci
                  npm run typecheck

    unit-tests:
        name: Backend Unit Tests
        runs-on: ubuntu-latest
        # The social integration suite (vibeProfile/social/socialProfile) needs a
        # real Postgres with pgvector -- not stock postgres, `vibe.fused_track`'s
        # v3 column is a vector type. DATABASE_URL below is the same
        # test/test@localhost:5433/test that backend/src/__mocks__/test-env.cjs
        # falls back to for local dev (see test-db-defaults.cjs), so this job
        # doesn't need its own separate credentials to keep in sync.
        services:
            postgres:
                image: pgvector/pgvector:pg16
                env:
                    POSTGRES_USER: test
                    POSTGRES_PASSWORD: test
                    POSTGRES_DB: test
                ports:
                    - 5433:5432
                options: >-
                    --health-cmd "pg_isready -U test -d test"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        env:
            DATABASE_URL: postgresql://test:test@localhost:5433/test
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: "npm"
                  cache-dependency-path: backend/package-lock.json

            - name: Install dependencies
              working-directory: backend
              run: npm ci

            - name: Apply database migrations
              working-directory: backend
              run: npx prisma migrate deploy

            - name: Run Jest
              working-directory: backend
              # Exclude webhookEventStore -- it is an integration test requiring
              # a live PostgreSQL database. It runs in integration.yml instead.
              # (Unrelated to the Postgres service above, which now covers the
              # vibeProfile/social/socialProfile integration suite instead --
              # see backend/src/__mocks__/test-global-setup.cjs for the one
              # thing a fresh database here still doesn't have: the vibe-engine's
              # OWN tables, not owned by these migrations. It bootstraps a
              # minimal stand-in; see that file's comment for the real boundary.)
              run: npm test -- --passWithNoTests --testPathIgnorePatterns="webhookEventStore"

    build-docker:
        name: Docker Build Check
        runs-on: ubuntu-latest
        needs: [lint-frontend, typecheck, unit-tests]
        steps:
            - uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build Docker image (no push)
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: false
                  tags: kima:pr-check
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

aio-smoke:
        name: All-in-One Fresh-Install Smoke Test
        runs-on: ubuntu-latest
        timeout-minutes: 90
        needs: [build-docker]
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4

            # The full AIO image includes PyTorch/Essentia and model files.
            # Free up preinstalled SDKs before loading the image into Docker.
            - name: Free disk and record runner resources
              run: |
                  sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android "$AGENT_TOOLSDIRECTORY"
                  df -h /
                  free -h

            - uses: docker/setup-buildx-action@v3

            - name: Build and load local AIO image (never push)
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: false
                  load: true
                  tags: chillverse-listen:aio-ci-smoke
                  cache-from: type=gha
                  build-args: |
                      NEXT_PUBLIC_BUILD_TYPE=ci-smoke

            - name: Boot a fresh isolated AIO instance and check endpoints
              shell: bash
              timeout-minutes: 15
              run: |
                  set -euo pipefail

                  name="chillverse-aio-ci-smoke"
                  docker volume create chillverse-ci-aio-data
                  docker volume create chillverse-ci-aio-music

                  cleanup() {
                      docker logs --tail 100 "$name" || true
                      docker rm -f "$name" || true
                      docker volume rm -f chillverse-ci-aio-data chillverse-ci-aio-music || true
                  }
                  trap cleanup EXIT

                  # Only loopback is published on GitHub's disposable runner.
                  # No secrets, no production mounts, no registry push.
                  docker run -d --name "$name" \
                      --memory=6g \
                      -p 127.0.0.1:3130:3030 \
                      -v chillverse-ci-aio-data:/data \
                      -v chillverse-ci-aio-music:/music \
                      -e DISABLE_CLAP=true \
                      chillverse-listen:aio-ci-smoke

                  ready=false
                  for i in $(seq 1 120); do
                      health="$(docker inspect --format '{{.State.Health.Status}}' "$name")"
                      state="$(docker inspect --format '{{.State.Status}}' "$name")"
                      if [ "$health" = "healthy" ]; then
                          ready=true
                          break
                      fi
                      if [ "$state" = "exited" ] || [ "$state" = "dead" ]; then
                          echo "Container stopped unexpectedly: $state"
                          break
                      fi
                      sleep 5
                  done

                  if [ "$ready" != true ]; then
                      echo "AIO did not become healthy within 10 minutes."
                      exit 1
                  fi

                  curl -fsS --max-time 20 http://127.0.0.1:3130/onboarding -o /dev/null

                  curl -fsS --max-time 20 http://127.0.0.1:3130/api/branding \
                      | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["name"] == "Kima", d; assert d["accentColor"] == "#fca200", d; print("Fresh-install default branding OK")'

                  # Fresh installs must have both permission fields and the
                  # instance branding table after automatic Prisma migrations.
                  n="$(docker exec -u postgres "$name" psql -d kima -Atc "SELECT count(*) FROM information_schema.columns WHERE table_name='User' AND column_name IN ('canRequestAlbums','canDownloadTracks')")"
                  test "$n" = "2"
                  table="$(docker exec -u postgres "$name" psql -d kima -Atc "SELECT count(*) FROM information_schema.tables WHERE table_name='BrandingSettings'")"
                  test "$table" = "1"
                  echo "Fresh-install Prisma migrations OK"

                  # An unauthenticated visitor cannot edit installation branding.
                  status="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' \
                      -X POST -H 'Content-Type: application/json' \
                      -d '{"name":"Unauthorized"}' \
                      http://127.0.0.1:3130/api/branding)"
                  if [ "$status" != "401" ] && [ "$status" != "403" ]; then
                      echo "Unexpected unauthenticated branding update status: $status"
                      exit 1
                  fi

                  echo "AIO fresh-install smoke test passed"
