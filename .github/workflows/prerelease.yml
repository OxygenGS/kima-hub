name: Pre-release Image

# Opt-in isolated RC on a gated same-repo draft PR, otherwise manual only.
# Each architecture builds on a native runner, never in QEMU.
# The two platform-specific staging tags are pushed only after scanning the
# EXACT image. The combined prerelease tag is built after both jobs succeed.
on:
  # One-time isolated release for the exact in-repo RC PR, observable via PR checks.
  # Never publish from the stable branch or an untrusted fork.
  pull_request:
    branches:
      - feat/downtify-lidarr-v2
    types: [opened, synchronize, reopened]
concurrency:
  group: prerelease-downtify-rc7
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  validate:
    name: Validate candidate release metadata and suffix
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      image: ${{ steps.meta.outputs.image }}
      short: ${{ steps.meta.outputs.short }}
      suffix: ${{ steps.meta.outputs.suffix }}
      source: ${{ steps.meta.outputs.source }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2d74033c85d532a9c120da8a0611a1a547ee9ab7
      - name: Assert the exact fully CI-green candidate is being released
        shell: bash
        env:
          EXPECTED_SOURCE: 2d74033c85d532a9c120da8a0611a1a547ee9ab7
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          EXPECTED_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
            test "$PR_HEAD" = "rc/downtify-v1.20.0-rc7"
            test "$PR_BASE" = "feat/downtify-lidarr-v2"
            test "$PR_HEAD_REPO" = "$EXPECTED_REPO"
            test "$EVENT_REF" = "refs/pull/$PR_NUMBER/merge"
          fi
      - name: Wait for five successful exact-source GitHub CI workflows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: 2d74033c85d532a9c120da8a0611a1a547ee9ab7
        run: |
          set -euo pipefail
          for attempt in $(seq 1 150); do
            gh api "repos/$GH_REPO/actions/runs?head_sha=$SOURCE_SHA&per_page=100" > "$RUNNER_TEMP/source-ci.json"
            if python3 - "$RUNNER_TEMP/source-ci.json" <<'PY'
          import json,os,sys
          data=json.load(open(sys.argv[1],encoding="utf-8"))
          runs=data.get("workflow_runs",[])
          names=("PR Checks","Fork Compatibility and Native AIO Checks",
                 "Security Checks","Public Language UI",
                 "Nonroot AIO production wiring and unit guards")
          sha=os.environ["SOURCE_SHA"]
          pending=[]
          for name in names:
              found=[r for r in runs if r.get("name")==name and r.get("head_sha")==sha
                     and r.get("event")=="pull_request"]
              if not found:
                  pending.append(name+": missing")
                  continue
              latest=max(found,key=lambda r:(r.get("created_at",""),r.get("run_attempt",0)))
              if latest.get("status")=="completed":
                  if latest.get("conclusion")!="success":
                      sys.exit("FAILED: "+name+" = "+str(latest.get("conclusion")))
                  print("PASS: "+name)
              else:
                  pending.append(name+": "+str(latest.get("status")))
          if pending:
              print("WAITING: "+"; ".join(pending))
              sys.exit(3)
          PY
            then
              echo "Five exact-source workflows green; authorize isolated RC7 build."
              break
            else
              code=$?
              if [ "$code" != 3 ]; then exit 1; fi
              if [ "$attempt" = 150 ]; then
                echo "::error::Timed out waiting for verified source CI"
                exit 1
              fi
              sleep 30
            fi
          done
      - name: Refuse to reuse an already published RC7 tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view downtify-v1.20.0-rc7 >/dev/null 2>&1; then
            echo "::error::RC7 already exists; no tag or image overwrite allowed."
            exit 1
          fi
      - name: Validate fork version and changelog
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/ci/check-release-metadata.py --self-test
          python3 .github/ci/check-release-metadata.py --candidate
      - name: Validate suffix BEFORE expensive Docker builds
        id: meta
        shell: bash
        env:
          TAG_SUFFIX: downtify-v1.20.0-rc7
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [ -n "$TAG_SUFFIX" ] && ! [[ "$TAG_SUFFIX" =~ ^[a-z0-9][a-z0-9.-]{0,31}$ ]]; then
            echo "Use just v111-rc2, without the tag_suffix label." >&2
            exit 1
          fi
          short="$(git rev-parse --short=7 HEAD)"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "suffix=$TAG_SUFFIX" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${OWNER,,}/kima-hub" >> "$GITHUB_OUTPUT"

  native-build:
    name: Native ${{ matrix.arch }} - build, scan and stage image
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            # Playwright 1.58.2 does not support Chromium on Ubuntu 26.04.
            # Match the proven browser/security CI runner; do not skip AIO smoke.
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2d74033c85d532a9c120da8a0611a1a547ee9ab7
      - name: Free runner disk for audio/ML image
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android "$AGENT_TOOLSDIRECTORY"
          df -h /
      - name: Install SHA-256-verified Trivy before expensive native image build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/ci/install-trivy-verified.sh
      - uses: docker/setup-buildx-action@v3
      - name: Build and load native image - no registry push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: kima:prerelease-scan
          build-args: |
            NEXT_PUBLIC_BUILD_TYPE=prerelease
          labels: |
            org.opencontainers.image.revision=${{ needs.validate.outputs.source }}
            org.opencontainers.image.version=prerelease-${{ needs.validate.outputs.short }}
          cache-from: type=gha,scope=prerelease-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=prerelease-${{ matrix.arch }}
      - name: Assert image architecture
        env:
          EXPECTED: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test "$(docker image inspect kima:prerelease-scan --format '{{.Architecture}}')" = "$EXPECTED"
      - name: AIO smoke of the EXACT image intended for release
        timeout-minutes: 35
        run: |
          set -euo pipefail
          docker tag kima:prerelease-scan kima-hub:aio-ci-smoke
          AIO_SMOKE_WITH_CLAP=1 bash .github/ci/v111-aio-runtime-smoke.sh
      - name: Block fixable HIGH/CRITICAL vulnerabilities in this image
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 0 \
            --format json --output "$RUNNER_TEMP/prerelease-image-vulnerabilities.json" kima:prerelease-scan
          python3 .github/ci/evaluate-image-vulnerabilities.py --self-test
          python3 .github/ci/evaluate-image-vulnerabilities.py "$RUNNER_TEMP/prerelease-image-vulnerabilities.json" "$ARCH"
      - name: Block embedded secrets before image push
        run: |
          set -euo pipefail
          trivy image --scanners secret --ignorefile .trivyignore \
            --skip-files '/etc/ssl/private/ssl-cert-snakeoil.key' \
            --exit-code 1 --format table kima:prerelease-scan
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push precisely the scanned native image to staging tag
        env:
          IMAGE: ${{ needs.validate.outputs.image }}
          SHORT: ${{ needs.validate.outputs.short }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          arch_tag="${IMAGE}:prerelease-${SHORT}-${ARCH}"
          docker tag kima:prerelease-scan "$arch_tag"
          docker push "$arch_tag"
          echo "Successfully scanned and staged native $ARCH image at $arch_tag" >> "$GITHUB_STEP_SUMMARY"

  assemble:
    name: Assemble verified AMD64 and ARM64 manifest
    needs: [validate, native-build]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compose, verify and publish candidate (never latest)
        id: manifest
        env:
          IMAGE: ${{ needs.validate.outputs.image }}
          SHORT: ${{ needs.validate.outputs.short }}
          SUFFIX: ${{ needs.validate.outputs.suffix }}
          SOURCE_SHA: ${{ needs.validate.outputs.source }}
        shell: bash
        run: |
          set -euo pipefail
          candidate="${IMAGE}:prerelease-${SHORT}"
          tags=(-t "$candidate")
          if [ -n "$SUFFIX" ]; then
            tags+=(-t "${IMAGE}:prerelease-${SUFFIX}")
          fi
          docker buildx imagetools create "${tags[@]}" \
            "${IMAGE}:prerelease-${SHORT}-amd64" \
            "${IMAGE}:prerelease-${SHORT}-arm64"

          docker buildx imagetools inspect --raw "$candidate" |
            python3 -c '
          import json,sys
          index=json.load(sys.stdin)
          platforms={(m.get("platform",{}).get("os"),m.get("platform",{}).get("architecture")) for m in index.get("manifests",[])}
          assert {("linux","amd64"),("linux","arm64")} <= platforms, f"Missing architecture: {platforms}"
          print("Verified native AMD64 + ARM64 index")
          '
          digest="$(docker buildx imagetools inspect "$candidate" | sed -n 's/^Digest: *\(sha256:[a-f0-9]\{64\}\).*/\1/p' | head -n 1)"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          # Do not change :latest, stable tags or the shared :prerelease alias.
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "### Verified multiarchitecture pre-release candidate"
            echo "Source commit: $SOURCE_SHA"
            echo "Immutable OCI index: ${IMAGE}@${digest}"
            echo "Pinned candidate: $candidate"
            if [ -n "$SUFFIX" ]; then
              echo "Named candidate: ${IMAGE}:prerelease-${SUFFIX}"
            fi
            echo "Each native platform's exact loaded image passed vulnerability and secret scanning before GHCR staging."
            echo "NO stable tag, :latest update, merge, or production installation change."
          } >> "$GITHUB_STEP_SUMMARY"

  publish-downtify-test-release:
    name: Publish opt-in Downtify GitHub prerelease after audited images
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'rc/downtify-v1.20.0-rc7' && github.event.pull_request.base.ref == 'feat/downtify-lidarr-v2' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [validate, native-build, assemble]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: read
    steps:
      - name: Publish GitHub prerelease without altering stable releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IMAGE: ${{ needs.validate.outputs.image }}
          SOURCE_SHA: ${{ needs.validate.outputs.source }}
          DIGEST: ${{ needs.assemble.outputs.digest }}
          SHORT: ${{ needs.validate.outputs.short }}
        shell: bash
        run: |
          set -euo pipefail
          test "$SOURCE_SHA" = "2d74033c85d532a9c120da8a0611a1a547ee9ab7"
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          tag="downtify-v1.20.0-rc7"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::A release with this exact RC tag already exists; never silently replace it."
            exit 1
          fi
          cat > /tmp/downtify-test-notes.md <<EOF
          ## Downtify native auto-import — TEST RELEASE ONLY

          This is an opt-in **release candidate**, NOT the next stable Kima Hub
          release. It is built from the fully CI-green native-import candidate
          commit \`$SOURCE_SHA\`. The shipped app's version field is still 1.19.0;
          the container tag below identifies this experimental build.

          **Scanned multiarchitecture image (amd64 + arm64):**
          \`$IMAGE@$DIGEST\`

          **Convenience tag (test only):**
          \`$IMAGE:prerelease-downtify-v1.20.0-rc7\`

          All images were built on native runners, tested with a disposable AIO
          smoke suite, inspected for HIGH/CRITICAL vulnerability advisories,
          and scanned for embedded secrets before publishing.

          ### Before testing

          - RC7 is intentionally separate from stable v1.19.0 and :latest.
            The maintainer has elected to validate it on an existing live
            installation, not a disposable lab. This is higher-risk.
          - BEFORE installing, verify an INDEPENDENT cold backup and actual
            restore of the full persistent /data volume (including database);
            preserve the current Compose/Dockge configuration and library.
            A Docker image downgrade is NOT database rollback.
          - RC7 preserves the RC3 read-only setup and private-mount
            rights fix for root:root 0775 music roots.
          - RC7 retains token-free Spotify embed identity verification,
            exact pinned remote owner and original recording checks.
          - NEW explicit owner-bound Lidarr-managed mode stages verified
            audio OUTSIDE the music root, submits one uniquely matched
            manual-import COPY, waits for a Lidarr TrackFile and exact
            full-file SHA-256, then confirms Kima's scanner receipt.
          - Auto-creating artists is OFF by default. When opted in it
            adds only ONE uniquely identified unmonitored MusicBrainz
            artist without searching for missing albums.
          - The original Kima-only mode stays DEFAULT and old RC6 Kima
            imports, their exact paths and prior review claims survive.
          - On-demand, admin-only diagnosis of ONE actual waiting source
            verifies the paired owner, completed Downtify job, mobile
            library mapping and original HTTP headers, without media
            writes, new claims, scan requests or exposed credentials.
          - A proven unwritten RC3 Spotify-403 claim can be requeued
            ONE at a time, via an explicit admin action only. No arbitrary
            uncertain claim or published media can be retried.
          - Completed Downtify queue rows may disappear while original
            audio stays in the library; the diagnosis reports this as
            not_completed and still forbids filename-only importing.
          - AIO startup creates ONLY a private backend-owned
            /music/Singles/Downtify directory (mode 0750) when safe, and
            never takes over existing foreign-owned audio or folders.
          - The private volume proof is stored inside this dedicated leaf,
            with backward compatibility for previous valid root markers.
          - Native auto-import remains OFF until explicit consent.
          - Disable and prevent auto-restart of any previous importer
            writing into the same music directory BEFORE native cutover.
            Otherwise there are two writers and the migration is unsafe.
          - Kima must be paired to the correct real Downtify API v1 server
            and owner via Settings. A new track is needed after baseline;
            old completed jobs are deliberately not imported.
          - A passing CI build is not proof of real Downtify transfer,
            correct audio, artist-page indexing, playback or recoverability.

          ### What to test

          RC7 is TEST-ONLY. Before installing on any existing library,
          independently verify a cold /data backup AND restoration.
          Keep the same /music, /downloads, secrets, persistent volumes
          and Compose project. Pause native importing, select Lidarr
          ownership and prove the actual shared staging and music roots.
          A missing mount must FAIL CLOSED, not write into a fallback.
          Import ONE NEW post-baseline track with unambiguous MusicBrainz
          album identity. Verify: no media written to Lidarr root by Kima;
          one Lidarr manual-import command, real Lidarr TrackFile receipt,
          exact physical byte SHA256, Kima index receipt, artist/album
          listing and actual playback. Do not migrate the old RC6 files,
          resubmit unknown remote writes or rewrite SQL state. A passing
          CI image is NOT real dual-library end-to-end proof. After backup and single-writer cutover, pair
          Downtify and run the four read-only setup checks. Activate native
          import, start one genuinely NEW Spotify track after baseline,
          verify source versus destination SHA-256, scanner receipt, artist
          page and web/OpenSubsonic playback. Verify that two-track batches
          do not duplicate scans and that unavailable Downtify/Redis
          permits later local scan-only recovery. Check idempotence,
          wrong/missing mount rejection and the independent data restore.
          No existing media or remote original may be overwritten/deleted.

          Full testing protocol:
          https://github.com/OxygenGS/kima-hub/blob/feat/downtify-lidarr-v2/docs/downtify-staging-canary.md

          **Do not promote this RC to stable until the real import and
          independent storage/restore gates have passed.**
          EOF
          gh release create "$tag" \
            --target "$SOURCE_SHA" \
            --title "Kima Hub Downtify v1.20.0 RC7 — test only" \
            --prerelease \
            --notes-file /tmp/downtify-test-notes.md
          echo "RC published from $SOURCE_SHA with immutable image $IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
