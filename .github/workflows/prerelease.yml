name: Pre-release Image

# Manual only. Each architecture builds on a native runner, never in QEMU.
# The two platform-specific staging tags are pushed only after scanning the
# EXACT image. The combined prerelease tag is built after both jobs succeed.
on:
  # One-shot opt-in candidate from a dedicated branch, never from main.
  # Only editing THIS workflow triggers image publication.
  push:
    branches: ['preview/downtify-lidarr-v2']
    paths: ['.github/workflows/prerelease.yml']
  workflow_dispatch:
    inputs:
      tag_suffix:
        description: "Optional suffix only, e.g. v111-rc2 (do not type tag_suffix)"
        required: false
        type: string

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  validate:
    name: Validate candidate release metadata and suffix
    if: github.repository == 'OxygenGS/kima-hub'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      image: ${{ steps.meta.outputs.image }}
      short: ${{ steps.meta.outputs.short }}
      suffix: ${{ steps.meta.outputs.suffix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Require verified PR source for isolated Lidarr preview
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE: "af5720b75e46cf34d60f9cc0becc070365ab3a72"
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/preview/downtify-lidarr-v2'
          parent="$(git rev-parse HEAD^)"
          if [ "$parent" != "$EXPECTED_SOURCE" ]; then
            echo "Preview must be exactly one workflow-only commit after verified PR #231 head." >&2
            exit 1
          fi
          test "$(git diff --name-only "$parent" HEAD)" = '.github/workflows/prerelease.yml'
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$parent&per_page=100" > "$RUNNER_TEMP/verified-pr-checks.json"
          python3 - "$RUNNER_TEMP/verified-pr-checks.json" "$parent" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding='utf-8'))
          parent=sys.argv[2]
          required={
              "PR Checks",
              "Security Checks",
              "Public Language UI",
              "Nonroot AIO production wiring and unit guards",
              "Fork Compatibility and Native AIO Checks",
          }
          ok={run["name"] for run in data.get("workflow_runs",[])
              if run.get("head_sha")==parent and run.get("conclusion")=="success"}
          missing=required-ok
          if missing:
              raise SystemExit("Refusing unverified test image; incomplete or failed gates: "+", ".join(sorted(missing)))
          print("All five PR #231 source workflows passed on immutable parent SHA")
          PY
      - name: Validate fork version and changelog
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/ci/check-release-metadata.py --self-test
          python3 .github/ci/check-release-metadata.py --candidate
      - name: Validate suffix BEFORE expensive Docker builds
        id: meta
        shell: bash
        env:
          TAG_SUFFIX: ${{ inputs.tag_suffix }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [ -n "$TAG_SUFFIX" ] && ! [[ "$TAG_SUFFIX" =~ ^[a-z0-9][a-z0-9.-]{0,31}$ ]]; then
            echo "Use just v111-rc2, without the tag_suffix label." >&2
            exit 1
          fi
          short="$(git rev-parse --short=7 HEAD)"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "suffix=$TAG_SUFFIX" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${OWNER,,}/kima-hub" >> "$GITHUB_OUTPUT"

  native-build:
    name: Native ${{ matrix.arch }} - build, scan and stage image
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk for audio/ML image
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android "$AGENT_TOOLSDIRECTORY"
          df -h /
      - uses: docker/setup-buildx-action@v3
      - name: Build and load native image - no registry push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: kima:prerelease-scan
          build-args: |
            NEXT_PUBLIC_BUILD_TYPE=prerelease
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=prerelease-${{ needs.validate.outputs.short }}
          cache-from: type=gha,scope=prerelease-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=prerelease-${{ matrix.arch }}
      - name: Assert image architecture
        env:
          EXPECTED: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test "$(docker image inspect kima:prerelease-scan --format '{{.Architecture}}')" = "$EXPECTED"
      - name: Install pinned Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: true
      - name: Block fixable HIGH/CRITICAL vulnerabilities in this image
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 0 \
            --format json --output "$RUNNER_TEMP/prerelease-image-vulnerabilities.json" kima:prerelease-scan
          python3 .github/ci/evaluate-image-vulnerabilities.py --self-test
          python3 .github/ci/evaluate-image-vulnerabilities.py "$RUNNER_TEMP/prerelease-image-vulnerabilities.json" "$ARCH"
      - name: Block embedded secrets before image push
        run: |
          set -euo pipefail
          trivy image --scanners secret --ignorefile .trivyignore \
            --skip-files '/etc/ssl/private/ssl-cert-snakeoil.key' \
            --exit-code 1 --format table kima:prerelease-scan
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push precisely the scanned native image to staging tag
        env:
          IMAGE: ${{ needs.validate.outputs.image }}
          SHORT: ${{ needs.validate.outputs.short }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          arch_tag="${IMAGE}:prerelease-${SHORT}-${ARCH}"
          docker tag kima:prerelease-scan "$arch_tag"
          docker push "$arch_tag"
          echo "Successfully scanned and staged native $ARCH image at $arch_tag" >> "$GITHUB_STEP_SUMMARY"

  assemble:
    name: Assemble verified AMD64 and ARM64 manifest
    needs: [validate, native-build]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compose, verify and publish candidate (never latest)
        env:
          IMAGE: ${{ needs.validate.outputs.image }}
          SHORT: ${{ needs.validate.outputs.short }}
          SUFFIX: ${{ needs.validate.outputs.suffix }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          candidate="${IMAGE}:prerelease-${SHORT}"
          tags=(-t "$candidate")
          if [ -n "$SUFFIX" ]; then
            tags+=(-t "${IMAGE}:prerelease-${SUFFIX}")
          fi
          docker buildx imagetools create "${tags[@]}" \
            "${IMAGE}:prerelease-${SHORT}-amd64" \
            "${IMAGE}:prerelease-${SHORT}-arm64"

          docker buildx imagetools inspect --raw "$candidate" |
            python3 -c '
          import json,sys
          index=json.load(sys.stdin)
          platforms={(m.get("platform",{}).get("os"),m.get("platform",{}).get("architecture")) for m in index.get("manifests",[])}
          assert {("linux","amd64"),("linux","arm64")} <= platforms, f"Missing architecture: {platforms}"
          print("Verified native AMD64 + ARM64 index")
          '
          digest="$(docker buildx imagetools inspect "$candidate" | sed -n 's/^Digest: *\(sha256:[a-f0-9]\{64\}\).*/\1/p' | head -n 1)"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          # Preview push keeps all moving aliases and stable tags untouched.
          # Only an explicitly dispatched prerelease may advance :prerelease.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            docker buildx imagetools create -t "${IMAGE}:prerelease" "${IMAGE}@${digest}"
          fi
          {
            echo "### Verified multiarchitecture pre-release candidate"
            echo "Source commit: $SOURCE_SHA"
            echo "Immutable OCI index: ${IMAGE}@${digest}"
            echo "Pinned candidate: $candidate"
            if [ -n "$SUFFIX" ]; then
              echo "Named candidate: ${IMAGE}:prerelease-${SUFFIX}"
            fi
            echo "Each native platform's exact loaded image passed vulnerability and secret scanning before GHCR staging."
            echo "Preview push changes no moving alias; pinned candidate is prerelease-${SHORT}."
            echo "NO stable tag, :latest update, merge, or production installation change."
          } >> "$GITHUB_STEP_SUMMARY"
