name: Native Release Preflight

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: Candidate stable version matching package metadata
        required: true
        default: v1.13.0
        type: string

# Build-only gate. Never create tags, releases, or registry images.
permissions:
  contents: read
concurrency:
  group: native-release-preflight
  cancel-in-progress: false

jobs:
  validate:
    name: Verify release candidate source
    runs-on: ubuntu-24.04
    outputs:
      source: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require main and exact stable release metadata
        id: source
        shell: bash
        env:
          VERSION: ${{ inputs.version_tag }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 .github/ci/check-release-metadata.py --self-test
          python3 .github/ci/check-release-metadata.py --tag "$VERSION"
          python3 .github/ci/build-release-notes.py --tag "$VERSION" --output "$RUNNER_TEMP/release-notes.md"
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "Preflight source: $GITHUB_SHA; version: $VERSION" >> "$GITHUB_STEP_SUMMARY"

  native-build:
    name: Native ${{ matrix.arch }} build and security scan (no push)
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source }}
          persist-credentials: false
      - name: Record and verify exact source SHA
        shell: bash
        env:
          SOURCE: ${{ needs.validate.outputs.source }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          echo "Native ${{ matrix.arch }} source SHA: $SOURCE" >> "$GITHUB_STEP_SUMMARY"
      - name: Free runner disk space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android "$AGENT_TOOLSDIRECTORY"
          df -h /
      - uses: docker/setup-buildx-action@v3
      - name: Build and load exact native image (never publish)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: kima:preflight-scan
          build-args: |
            NEXT_PUBLIC_BUILD_TYPE=oxygen-fork
          labels: |
            org.opencontainers.image.revision=${{ needs.validate.outputs.source }}
            org.opencontainers.image.version=${{ inputs.version_tag }}
          cache-from: type=gha,scope=stable-${{ matrix.arch }}
      - name: Verify image architecture and source
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          SOURCE: ${{ needs.validate.outputs.source }}
          VERSION: ${{ inputs.version_tag }}
        run: |
          set -euo pipefail
          test "$(docker image inspect kima:preflight-scan --format '{{.Architecture}}')" = "$ARCH"
          test "$(docker image inspect kima:preflight-scan --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$SOURCE"
          test "$(docker image inspect kima:preflight-scan --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')" = "$VERSION"
      - name: Install pinned Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: true
      - name: Block fixable HIGH and CRITICAL image vulnerabilities
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 0 \
            --format json --output "$RUNNER_TEMP/preflight-vulnerabilities.json" kima:preflight-scan
          python3 .github/ci/evaluate-image-vulnerabilities.py --self-test
          python3 .github/ci/evaluate-image-vulnerabilities.py "$RUNNER_TEMP/preflight-vulnerabilities.json" "$ARCH"
      - name: Block embedded image secrets
        shell: bash
        run: |
          set -euo pipefail
          trivy image --scanners secret --ignorefile .trivyignore \
            --skip-files '/etc/ssl/private/ssl-cert-snakeoil.key' \
            --exit-code 1 --format table kima:preflight-scan
      - name: Retain architecture-specific vulnerability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-preflight-${{ matrix.arch }}
          path: ${{ runner.temp }}/preflight-vulnerabilities.json
          if-no-files-found: warn
          retention-days: 14
      - name: Record verified native image
        shell: bash
        run: |
          echo "Native ${{ matrix.arch }}: exact-source build, vulnerability and secret gates PASS. Review residual advisories before publication. No image published." >> "$GITHUB_STEP_SUMMARY"
