name: Bootstrap isolated v1.11 implementation branch

on:
  pull_request:
    branches:
      - feature/interface-language-switcher
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  bootstrap:
    # Never run with write access for external forks or arbitrary PRs.
    if: github.event.pull_request.number == 6 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/upstream-v1.11-integration'
    name: Create experimental v1.11 branch once (never main)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Create separate experimental branch from reviewed code
        shell: bash
        run: bash .github/ci/create-v111-experimental-branch.sh
