name: Regenerate security fix lockfiles

on:
  push:
    branches:
      - fix/v1115-docker-security-dependencies
    paths:
      - backend/package.json
      - frontend/package.json
      - .github/workflows/security-lockfile-refresh.yml

permissions:
  contents: write

concurrency:
  group: regenerate-security-lockfiles
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1115-docker-security-dependencies
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regenerate both lockfiles and upgrade vulnerable body-parser trees
        shell: bash
        run: |
          set -euo pipefail
          cd backend
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm update body-parser --package-lock-only --ignore-scripts --no-audit --no-fund
          node - <<'NODE'
          const lock = require('./package-lock.json');
          const get = (s) => lock.packages[s]?.version;
          for (const [name, expected] of Object.entries({
            'node_modules/body-parser': '1.20.9',
            'node_modules/@bull-board/express/node_modules/body-parser': '2.4.0',
            'node_modules/multer': '2.5.0',
            'node_modules/zod': '4.6.7',
          })) {
            if (get(name) !== expected) throw new Error(name + ': found ' + get(name) + '; expected ' + expected);
          }
          lock.version = '1.11.5';
          lock.packages[''].version = '1.11.5';
          NODE
          cd ../frontend
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          cd ..
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/package-lock.json frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(security): regenerate fixed npm dependency lockfiles'
            git push origin HEAD:fix/v1115-docker-security-dependencies
          fi
