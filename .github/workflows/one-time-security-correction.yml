name: One-time security dependency correction
on:
  push:
    branches:
      - feature/nl-bulk-dynamic-copy
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Update vulnerable sanitizer and restore compatible lint config
        run: |
          cd frontend
          npm install --package-lock-only --save-exact dompurify@3.4.17
          npm install --package-lock-only --save-dev --save-exact eslint-config-next@16.3.8
          npm ci --ignore-scripts --no-audit
      - name: Commit lockfile and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-security-correction.yml
          git add frontend/package.json frontend/package-lock.json
          git commit -m "fix(security): patch DOMPurify and restore compatible lint config"
          git push origin HEAD:feature/nl-bulk-dynamic-copy
