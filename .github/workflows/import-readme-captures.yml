name: Import reviewed release screenshots
on:
  push:
    branches: [docs/v113-readme]
    paths:
      - .github/ci/import-readme-captures.py
      - .github/workflows/import-readme-captures.yml
permissions:
  contents: write
  actions: read
concurrency:
  group: import-reviewed-readme-captures
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'OxygenGS/kima-hub' && github.ref == 'refs/heads/docs/v113-readme'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify released source and import only reviewed PNG captures
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/ci/import-readme-captures.py
      - name: Verify public content and commit documentation only
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/ci/check-public-source-privacy.py
          git add assets/screenshots/v1.13 CHANGELOG.md docs/install.md docs/release-v1.13.md .github/ci/check-fork-compose.sh
          if git diff --cached --quiet; then exit 0; fi
          git fetch origin docs/v113-readme
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/docs/v113-readme)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: import verified v1.13 screenshots and mark stable publication'
          git push origin HEAD:refs/heads/docs/v113-readme
