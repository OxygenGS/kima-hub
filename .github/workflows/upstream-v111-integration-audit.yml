name: Upstream v1.11.0 Integration Audit

# A draft PR against the existing fork feature branch runs an isolated
# merge rehearsal. This job fetches public upstream code but never pushes,
# publishes an image, changes the database or touches a production server.
on:
  pull_request:
    branches:
      - feature/interface-language-switcher
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  merge-audit:
    name: Dry-run upstream v1.11.0 merge (no write)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare real Git histories without changing the repository
        shell: bash
        run: bash .github/ci/upstream-v111-merge-audit.sh
      - name: Save detailed merge report for integration work
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-v111-merge-report
          path: audit/
          if-no-files-found: warn

  frontend-compatibility:
    name: Frontend compatibility typecheck, lint and auth regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Validate frontend TypeScript
        working-directory: frontend
        run: npm run typecheck
      - name: Validate frontend lint
        working-directory: frontend
        run: npm run lint
      - name: Test auth refresh and storage-denial handling
        working-directory: frontend
        run: npx vitest run lib/__tests__/api-token-refresh.test.ts lib/__tests__/api-storage-denied.test.ts

  public-locale-browser:
    name: English/Dutch browser behavior in integration branch
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Exercise locale selection (including blocked browser storage)
        working-directory: frontend
        env:
          CI: "true"
          NEXT_TELEMETRY_DISABLED: "1"
        run: npx playwright test --config playwright.public-locale.config.ts
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-integration-locale-browser
          path: frontend/test-results/
          retention-days: 7

  database-compatibility:
    name: Staged v1.11 migrations on throwaway PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: integration
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U test -d integration"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@localhost:5435/integration
      PGPASSWORD: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend Prisma CLI
        working-directory: backend
        run: npm ci --no-audit --no-fund
      - name: Rehearse all fork and upstream migration SQL on a fresh DB
        working-directory: backend
        run: npx prisma migrate deploy
      - name: Assert combined upstream and fork schema fundamentals
        env:
          PGHOST: localhost
          PGPORT: "5435"
          PGUSER: test
          PGDATABASE: integration
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $check$
          BEGIN
            IF (SELECT count(*) FROM information_schema.columns
                WHERE table_name = 'User'
                  AND column_name IN ('canRequestAlbums','canDownloadTracks')) <> 2
              THEN RAISE EXCEPTION 'Fork permissions missing after migration'; END IF;
            IF to_regclass('public."BrandingSettings"') IS NULL
              THEN RAISE EXCEPTION 'Fork branding missing after migration'; END IF;
            IF to_regclass('public."ReleaseAcknowledgement"') IS NULL
              THEN RAISE EXCEPTION 'Upstream release acknowledgements missing'; END IF;
            IF to_regclass('public."TrackStage"') IS NULL
              THEN RAISE EXCEPTION 'Upstream enrichment stage model missing'; END IF;
            IF NOT EXISTS (SELECT 1 FROM information_schema.columns
                WHERE table_name='Play' AND column_name='heard')
              THEN RAISE EXCEPTION 'Upstream play tracking field missing'; END IF;
            IF (SELECT count(*) FROM "_prisma_migrations" WHERE finished_at IS NOT NULL) < 110
              THEN RAISE EXCEPTION 'Not all staged migrations applied'; END IF;
          END
          $check$;
          SQL

  merged-prisma-schema:
    name: Validate merged Prisma schema and inventory backend type errors
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://test:test@localhost:5435/integration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --no-audit --no-fund
      - name: Require valid combined upstream and fork Prisma schema
        working-directory: backend
        run: |
          npx prisma validate
          npx prisma generate
      - name: Inventory transitional backend TypeScript mismatches
        shell: bash
        run: |
          set +e
          set -uo pipefail
          mkdir -p audit
          (cd backend && npm run typecheck) > audit/v111-backend-typecheck.txt 2>&1
          result=$?
          echo "## v1.11 backend integration diagnostic" >> "$GITHUB_STEP_SUMMARY"
          if [ "$result" -eq 0 ]; then
            echo "Backend typecheck: PASS" >> "$GITHUB_STEP_SUMMARY"
          else
            errors="$(grep -c 'error TS' audit/v111-backend-typecheck.txt || true)"
            echo "Backend typecheck: **NOT YET INTEGRATED** ($errors reported TypeScript errors)." >> "$GITHUB_STEP_SUMMARY"
            echo "The upstream schema and migrations are staged, but v1.11 backend APIs still need merging." >> "$GITHUB_STEP_SUMMARY"
            echo "This diagnostic alone does not approve a release." >> "$GITHUB_STEP_SUMMARY"
            tail -n 70 audit/v111-backend-typecheck.txt >> "$GITHUB_STEP_SUMMARY"
            echo "--- Backend TypeScript diagnostics (first 45) ---"
            grep 'error TS' audit/v111-backend-typecheck.txt | head -n 45 || true
          fi
          exit 0
      - name: Save backend diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v111-backend-typecheck-diagnostic
          path: audit/v111-backend-typecheck.txt
          if-no-files-found: warn

  original-v111-database-upgrade:
    name: Real v1.11 schema to fork permissions and branding
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: original_v111
        ports:
          - 5436:5432
        options: >-
          --health-cmd "pg_isready -U test -d original_v111"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@localhost:5436/original_v111
      PGHOST: localhost
      PGPORT: "5436"
      PGUSER: test
      PGDATABASE: original_v111
      PGPASSWORD: test
    steps:
      - uses: actions/checkout@v4
      - name: Checkout actual official v1.11 release schema and history
        uses: actions/checkout@v4
        with:
          repository: Chevron7Locked/kima-hub
          ref: v1.11.0
          path: upstream-v111
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install Prisma CLI
        working-directory: backend
        run: npm ci --no-audit --no-fund
      - name: Create official upstream v1.11 database by replaying its own history
        working-directory: upstream-v111/backend
        run: ../../backend/node_modules/.bin/prisma migrate deploy
      - name: Seed real synthetic v1.11 user and playlist
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO "User" ("id", "username", "passwordHash", "role", "tokenVersion")
          VALUES ('integration-v111-listener','ci_v111_listener','ci-synthetic-hash','user',7),
                 ('integration-v111-admin','ci_v111_admin','ci-synthetic-admin','admin',3);
          INSERT INTO "Playlist" ("id","userId","name","updatedAt")
          VALUES ('integration-v111-playlist','integration-v111-listener','Original 1.11 Playlist',NOW());
          SQL
      - name: Upgrade a synthetic original v1.11 database using staged fork migrations
        working-directory: backend
        run: npx prisma migrate deploy
      - name: Assert original v1.11 accounts, media settings and fork permissions survived
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $upgrade$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM "User"
                WHERE id='integration-v111-listener' AND username='ci_v111_listener'
                  AND "passwordHash"='ci-synthetic-hash' AND "tokenVersion"=7
                  AND NOT "canRequestAlbums" AND NOT "canDownloadTracks")
              THEN RAISE EXCEPTION 'v1.11 listener record or fail-closed permissions lost'; END IF;
            IF NOT EXISTS (SELECT 1 FROM "User"
                WHERE id='integration-v111-admin' AND "passwordHash"='ci-synthetic-admin')
              THEN RAISE EXCEPTION 'v1.11 admin record lost'; END IF;
            IF NOT EXISTS (SELECT 1 FROM "Playlist"
                WHERE id='integration-v111-playlist' AND "userId"='integration-v111-listener'
                  AND name='Original 1.11 Playlist')
              THEN RAISE EXCEPTION 'v1.11 playlist lost'; END IF;
            IF to_regclass('public."BrandingSettings"') IS NULL
              THEN RAISE EXCEPTION 'Fork branding table not installed'; END IF;
            IF to_regclass('public."ReleaseAcknowledgement"') IS NULL
              THEN RAISE EXCEPTION 'Upstream 1.11 release table unexpectedly missing'; END IF;
            IF (SELECT count(*) FROM "_prisma_migrations"
                  WHERE finished_at IS NOT NULL) < 110
              THEN RAISE EXCEPTION 'Migration ledger unexpectedly incomplete'; END IF;
          END
          $upgrade$;
          SQL

  provisional-full-source-merge:
    name: Temporary v1.11 source compile preview (${{ matrix.conflicts }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        conflicts: [ours, theirs]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Preview conflict-free upstream changes using selected conflict policy
        shell: bash
        env:
          V111_CONFLICT_STRATEGY: ${{ matrix.conflicts }}
        run: bash .github/ci/v111-provisional-merge-check.sh
      - name: Upload temporary compile gap report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v111-provisional-source-compile-gaps-${{ matrix.conflicts }}
          path: audit/
          if-no-files-found: warn
          retention-days: 14
