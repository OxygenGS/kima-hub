name: Upstream v1.11.0 Integration Audit

# A draft PR against the existing fork feature branch runs an isolated
# merge rehearsal. This job fetches public upstream code but never pushes,
# publishes an image, changes the database or touches a production server.
on:
  pull_request:
    branches:
      - feature/interface-language-switcher
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  merge-audit:
    name: Dry-run upstream v1.11.0 merge (no write)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare real Git histories without changing the repository
        shell: bash
        run: bash .github/ci/upstream-v111-merge-audit.sh
      - name: Save detailed merge report for integration work
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-v111-merge-report
          path: audit/
          if-no-files-found: warn

  frontend-compatibility:
    name: Frontend compatibility typecheck, lint and auth regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Validate frontend TypeScript
        working-directory: frontend
        run: npm run typecheck
      - name: Validate frontend lint
        working-directory: frontend
        run: npm run lint
      - name: Test auth refresh and storage-denial handling
        working-directory: frontend
        run: npx vitest run lib/__tests__/api-token-refresh.test.ts lib/__tests__/api-storage-denied.test.ts

  public-locale-browser:
    name: English/Dutch browser behavior in integration branch
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Exercise locale selection (including blocked browser storage)
        working-directory: frontend
        env:
          CI: "true"
          NEXT_TELEMETRY_DISABLED: "1"
        run: npx playwright test --config playwright.public-locale.config.ts
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-integration-locale-browser
          path: frontend/test-results/
          retention-days: 7
