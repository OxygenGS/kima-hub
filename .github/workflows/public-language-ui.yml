name: Public Language UI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "frontend/**"
      - ".github/workflows/public-language-ui.yml"

permissions:
  contents: read

concurrency:
  group: public-language-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  public-language-browser:
    name: Browser Language Switching
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium and system dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Test login language switching and persistence
        working-directory: frontend
        env:
          CI: "true"
          NEXT_TELEMETRY_DISABLED: "1"
        run: npx playwright test --config playwright.public-locale.config.ts

      - name: Test responsive player components with the installed project React
        working-directory: frontend
        env:
          CI: "true"
        run: npx playwright test --config playwright.player-ui.config.ts

      - name: Preserve synthetic player browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-browser-evidence
          path: |
            frontend/test-results/player-ui/
            frontend/test-results/player-ui-bundle/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: language-browser-evidence
          path: |
            frontend/test-results/
          retention-days: 7
